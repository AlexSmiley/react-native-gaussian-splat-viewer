<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gaussian Splat Viewer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d18;color:#eef6ff;font:15px system-ui,sans-serif}#app{width:100vw;height:100vh;overflow:hidden}#toolbar{position:fixed;z-index:10000;top:16px;left:16px;right:16px;max-width:440px;padding:16px;background:#121b2cf2;border:1px solid #30435b;border-radius:14px}#toolbar[hidden]{display:none}h1{font-size:18px;margin:0 0 12px}input{max-width:100%;color:#eef6ff}input::file-selector-button{background:#80dfff;color:#07121e;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;margin-right:10px}#status{margin:12px 0 0;overflow-wrap:anywhere;color:#b8c9df}#status[role=alert]{color:#ffb4b4}
</style>
</head>
<body>
<div id="app"></div>
<section id="toolbar"><h1>Gaussian Splat Viewer</h1><label for="scene-file">Browse 3D file (.ply or .splat)</label><p><input id="scene-file" type="file" accept=".ply,.splat"></p><p id="status" role="status" aria-live="polite">Select a local file to view it. No server upload required.</p></section>
<script type="module" src="/src.js"></script>
</body>
</html>
